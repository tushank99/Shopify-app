server:
  port: 8095

spring:
  application:
    name: erp-service

  datasource:
    url: ${ERP_DB_URL:jdbc:mysql://localhost:3307/erp_db}
    username: ${ERP_DB_USER:erp}
    password: ${ERP_DB_PASSWORD:erp_pw}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema.
      ddl-auto: none
    properties:
      hibernate.jdbc.time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        # bounded: a broker outage must not block the publisher thread for the 60s default
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        # /actuator/health/liveness and /actuator/health/readiness (used by the OpenShift probes)
        enabled: true
      group:
        # not ready while MySQL is unreachable -> pod drops out of the Service, but is NOT restarted
        # (liveness stays app-only, so a database outage never causes a restart storm)
        readiness:
          include: readinessState,db

erp:
  currency: INR
  saga:
    # NONE | POST_LEDGER | SHIP : force a failure at that step to see the compensation path (demo only)
    simulate-failure-at: ${ERP_SIMULATE_FAILURE_AT:NONE}
  outbox:
    # false = no Kafka needed (e.g. the OpenShift sandbox); events stay PENDING in outbox_event
    enabled: ${ERP_OUTBOX_ENABLED:true}
    poll-ms: 1000
    batch-size: 50
    max-attempts: 20
    send-timeout-ms: 8000
