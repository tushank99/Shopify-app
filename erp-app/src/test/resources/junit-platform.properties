# Integration test classes run in @Order order (default for unannotated classes: after the ordered ones).
# SagaCompensationIntegrationTest must run first: its Spring context turns the outbox relay OFF, but every context
# shares one MySQL, so a relay from an already-started context would publish (instead of letting the saga cancel)
# the event that test is checking.
junit.jupiter.testclass.order.default=org.junit.jupiter.api.ClassOrderer$OrderAnnotation
