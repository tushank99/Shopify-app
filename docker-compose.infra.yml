# Local data layer for the outbox -> Kafka -> ledger pipeline.
#
#   docker compose -f docker-compose.infra.yml up -d
#   docker compose -f docker-compose.infra.yml --profile app up -d --build ledger-service
#
# Host connection strings:
#   MONGO_URI   = mongodb://127.0.0.1:27017/shopify?directConnection=true
#   KAFKA_BROKERS = localhost:9092
#   REDIS_URL     = redis://127.0.0.1:6379
#
# NOTE: retry-topic names below MUST match LEDGER_RETRY_ATTEMPTS (default 6 => retry-0..retry-4).

name: shopify-infra

services:
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      # Plain ping: must NOT depend on the replica set being initiated (mongo-init waits on this).
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  mongo-init:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    entrypoint:
      - bash
      - -c
      - |
        mongosh --host mongo:27017 --quiet --eval '
          let initiated = false;
          try { initiated = rs.status().ok === 1; } catch (e) { initiated = false; }
          if (initiated) {
            print("replica set already initiated");
          } else {
            printjson(rs.initiate({_id: "rs0", members: [{_id: 0, host: "mongo:27017"}]}));
          }
          let tries = 0;
          while (!db.hello().isWritablePrimary && tries < 60) { sleep(500); tries++; }
          if (!db.hello().isWritablePrimary) { print("node never became primary"); quit(1); }
          print("replica set ready (primary elected)");
        '

  redis:
    image: redis:7-alpine
    # BullMQ requires noeviction, and AOF keeps queued jobs and stock reservations across restarts.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      # Loopback only: this local instance has no password.
      # If 6379 is taken, set REDIS_HOST_PORT in .env and use the same port in REDIS_URL and REDIS_PORT.
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Single-node: every internal topic must be RF=1 or consumers hang forever.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Matches kafkajs allowAutoTopicCreation:false and @RetryableTopic autoCreateTopics=false.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 15s

  kafka-init:
    image: apache/kafka:3.8.0
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint:
      - bash
      - -c
      - |
        set -e
        for t in order.placed order.placed-retry-0 order.placed-retry-1 order.placed-retry-2 order.placed-retry-3 order.placed-retry-4 order.placed-dlt; do
          /opt/kafka/bin/kafka-topics.sh --create --if-not-exists \
            --bootstrap-server kafka:29092 --topic "$$t" --partitions 3 --replication-factor 1
        done
        /opt/kafka/bin/kafka-topics.sh --list --bootstrap-server kafka:29092

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ledger_db
      POSTGRES_USER: ${LEDGER_DB_USER:-ledger}
      POSTGRES_PASSWORD: ${LEDGER_DB_PASSWORD:-ledger_pw}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  jaeger:
    image: jaegertracing/all-in-one:1.60
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4318:4318"

    # Optional: run the Spring Boot ledger as a container (needed for the `docker kill` drills).
  ledger-service:
    profiles: ["app"]
    build:
      context: .
      dockerfile: ledger-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      jaeger:
        condition: service_started
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      LEDGER_DB_URL: jdbc:postgresql://postgres:5432/ledger_db
      LEDGER_DB_USER: ${LEDGER_DB_USER:-ledger}
      LEDGER_DB_PASSWORD: ${LEDGER_DB_PASSWORD:-ledger_pw}
      # Tracing (Java agent is baked into the image). Set LEDGER_OTEL_ENABLED=false to switch it off.
      OTEL_JAVAAGENT_ENABLED: ${LEDGER_OTEL_ENABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    ports:
      # Loopback only: the ledger API is unauthenticated in Phase 1 (JWT validation = Phase 2).
      # The management port (8081) is intentionally NOT published.
      - "127.0.0.1:8090:8080"

volumes:
  mongo_data:
  redis_data:
  kafka_data:
  pg_data: