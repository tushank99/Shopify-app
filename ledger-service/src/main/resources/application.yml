server:
  port: 8080

spring:
  application:
    name: ledger-service

  datasource:
    url: ${LEDGER_DB_URL:jdbc:postgresql://localhost:5432/ledger_db}
    username: ${LEDGER_DB_USER:ledger}
    password: ${LEDGER_DB_PASSWORD:ledger_pw}
    hikari:
      # Must be >= listener concurrency (3) plus REST traffic.
      maximum-pool-size: 10
      connection-timeout: 5000

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Entities are read-only; writes are native INSERT ... ON CONFLICT.
      ddl-auto: none
    properties:
      hibernate.jdbc.time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${LEDGER_CONSUMER_GROUP:ledger-service}
      # Without this, events produced before the first consumer start are skipped.
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Raw bytes: we parse + validate ourselves so a poison pill reaches the DLT byte-for-byte
      # and the DLT consumer can never fail to deserialize it again.
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
    listener:
      # Commit the offset after every processed record (not after the whole poll batch).
      ack-mode: record

# Actuator lives on its own port so the (unauthenticated, Phase 1) API port can be exposed
# without exposing /actuator/prometheus.
management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  metrics:
    tags:
      application: ledger-service

ledger:
  topic: order.placed
  concurrency: 3
  retry:
    # 6 attempts => 1 main topic + 5 retry topics (order.placed-retry-0 .. -retry-4) + order.placed-dlt.
    # docker-compose.infra.yml pre-creates exactly these topics. If you change `attempts`,
    # change the topic list in kafka-init too (auto-create is disabled).
    attempts: 6
    delay-ms: 2000
    multiplier: 2.0
    max-delay-ms: 30000